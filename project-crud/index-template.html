
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Management Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

/* TOP NAVIGATION */
.navbar {
    height: 65px;
    background: #172554;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 20px;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 10;
}

.menu-btn {
    font-size: 27px;
    cursor: pointer;
    border: none;
    background: none;
    color: white;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.profile {
    margin-left: auto;
    font-size: 14px;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: #1e293b;
    color: white;
    position: fixed;
    top: 65px;
    bottom: 0;
    left: 0;
    padding: 20px 12px;
    overflow-y: auto;
    transition: 0.3s;
}

.sidebar.closed {
    left: -250px;
}

.menu-heading {
    padding: 12px;
    font-size: 12px;
    color: #94a3b8;
    text-transform: uppercase;
}

.menu-item {
    padding: 13px 12px;
    margin: 5px 0;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
}

.menu-item:hover,
.menu-item.active {
    background: #334155;
}

.arrow {
    margin-left: auto;
}

.submenu {
    display: none;
    padding-left: 22px;
}

.submenu.show {
    display: block;
}

.submenu .menu-item {
    font-size: 14px;
    color: #cbd5e1;
}

/* MAIN CONTENT */
.main {
    margin-left: 250px;
    margin-top: 65px;
    padding: 30px;
    transition: 0.3s;
    min-height: calc(100vh - 65px);
}

.main.expanded {
    margin-left: 0;
}

.page-title {
    font-size: 25px;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    margin-bottom: 25px;
}

/* DASHBOARD CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0000000c;
}

.card h3 {
    color: #64748b;
    font-size: 15px;
    margin-bottom: 15px;
}

.card h1 {
    font-size: 30px;
    color: #1d4ed8;
}

/* FORMS */
.panel {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px #0000000c;
}

.panel h3 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-size: 14px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    background: white;
}

input:focus, select:focus {
    border-color: #2563eb;
}

.btn {
    padding: 11px 20px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    margin-top: 20px;
}

.btn:hover {
    background: #1d4ed8;
}

.btn-danger {
    background: #dc2626;
    padding: 7px 12px;
    margin: 0;
}

.btn-danger:hover {
    background: #b91c1c;
}

/* TABLE */
.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 15px;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    font-size: 14px;
    white-space: nowrap;
}

th {
    background: #eff6ff;
    color: #1e3a8a;
}

tbody tr:hover {
    background: #f8fafc;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 25px;
}

/* RESPONSIVE */
@media(max-width: 700px) {
    .sidebar {
        left: -250px;
        z-index: 5;
    }

    .sidebar.mobile-open {
        left: 0;
    }

    .main {
        margin-left: 0;
        padding: 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .logo {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<!-- TOP NAVBAR -->
<header class="navbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="logo">Country Management</div>
    <div class="profile">Admin 👤</div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

    <div class="menu-heading">Main Menu</div>

    <div class="menu-item active" onclick="showPage('dashboard', this)">
        🏠 Dashboard
    </div>

    <!-- USERS DROPDOWN -->
    <div class="menu-item" onclick="toggleDropdown('userMenu', 'userArrow')">
        👥 Users
        <span class="arrow" id="userArrow">▼</span>
    </div>

    <div class="submenu" id="userMenu">
        <div class="menu-item" onclick="showPage('addUser', this)">
            ➕ Add User
        </div>
        <div class="menu-item" onclick="showPage('viewUsers', this)">
            📋 View Users
        </div>
    </div>

    <!-- MASTERS DROPDOWN -->
    <div class="menu-item" onclick="toggleDropdown('masterMenu', 'masterArrow')">
        ⚙️ Masters
        <span class="arrow" id="masterArrow">▼</span>
    </div>

    <div class="submenu" id="masterMenu">

        <div class="menu-item" onclick="showPage('country', this)">
            🌍 Country
        </div>

        <div class="menu-item" onclick="showPage('city', this)">
            🏙️ City
        </div>

        <div class="menu-item" onclick="showPage('mapping', this)">
            🔗 Country City Mapping
        </div>

    </div>

</aside>

<!-- MAIN CONTENT -->
<main class="main" id="main">

    <div id="content"></div>

</main>

<script>

/* DATA STORAGE */

let users = [];
async function getAllUserData() {
    let response = await fetch("http://localhost:8080/country/GetAllDatas");
    users = await response.json();
}
let countries = JSON.parse(localStorage.getItem("countries")) || [];
let cities = JSON.parse(localStorage.getItem("cities")) || [];
let mappings = JSON.parse(localStorage.getItem("mappings")) || [];


function saveData() {
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("countries", JSON.stringify(countries));
    localStorage.setItem("cities", JSON.stringify(cities));
    localStorage.setItem("mappings", JSON.stringify(mappings));
}

/* NAVIGATION */

function toggleMenu() {
    const sidebar = document.getElementById("sidebar");

    if (window.innerWidth <= 700) {
        sidebar.classList.toggle("mobile-open");
    } else {
        sidebar.classList.toggle("closed");
        document.getElementById("main").classList.toggle("expanded");
    }
}

function toggleDropdown(menuId, arrowId) {
    const menu = document.getElementById(menuId);
    const arrow = document.getElementById(arrowId);

    menu.classList.toggle("show");
    arrow.innerText = menu.classList.contains("show") ? "▲" : "▼";
}

function showPage(page, element) {

    document.querySelectorAll(".menu-item").forEach(item => {
        item.classList.remove("active");
    });

    if (element) {
        element.classList.add("active");
    }

    const content = document.getElementById("content");

    if (page === "dashboard") {
        content.innerHTML = dashboardPage();
    }
    else if (page === "addUser") {
        content.innerHTML = addUserPage();
    }
   else if (page === "viewUsers") {

    content.innerHTML = "Loading users...";

    getAllUserData().then(() => {

        content.innerHTML = viewUsersPage();

    });

}
   
    else if (page === "country") {
        content.innerHTML = countryPage();
    }
    else if (page === "city") {
        content.innerHTML = cityPage();
    }
    else if (page === "mapping") {
        content.innerHTML = mappingPage();
    }

    if (window.innerWidth <= 700) {
        document.getElementById("sidebar").classList.remove("mobile-open");
    }
}

/* DASHBOARD PAGE */

function dashboardPage() {
    return `
        <h2 class="page-title">Dashboard</h2>
        <p class="description">Welcome to Country Management System</p>

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <h1>${users.length}</h1>
            </div>

            <div class="card">
                <h3>Total Countries</h3>
                <h1>${countries.length}</h1>
            </div>

            <div class="card">
                <h3>Total Cities</h3>
                <h1>${cities.length}</h1>
            </div>

            <div class="card">
                <h3>Total Mappings</h3>
                <h1>${mappings.length}</h1>
            </div>

        </div>
    `;
}

/* USER PAGE */

function addUserPage() {
    return `
        <h2 class="page-title">Add User</h2>
        <p class="description">Enter user details below</p>

        <div class="panel">
            <h3>User Information</h3>

            <form onsubmit="saveUserToDatabase(event)">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name" id="userName" required>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" name="age" id="userAge" min="1" required>
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" name="dob" id="userDob" required>
                    </div>

                    <div class="form-group">
                        <label>Select Country</label>
                        <select name="countryid" id="mapCountry"
                                onchange="loadCities()" required>
                            <option value="">Select Country</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select City</label>
                        <select name="cityid" id="mapCity" required>
                            <option value="">Select City</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Pincode</label>
                        <input type="text" name="pincode" id="userPincode" required>
                    </div>

                </div>

                <button class="btn" type="submit">Save User</button>
            </form>
        </div>
    `;
}



/* COUNTRY PAGE */

function countryPage() {
    return `
        <h2 class="page-title">Country Master</h2>
        <p class="description">Add and manage countries</p>

        <div class="panel">
            <h3>Add Country</h3>

            <form onsubmit="addCountry(event)">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Country Name</label>
                        <input id="countryName" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <input id="countryDescription">
                    </div>

                </div>

                <button class="btn" type="submit">Save Country</button>
            </form>
        </div>

        ${countryTable()}
    `;
}

function addCountry(event) {
    event.preventDefault();

    countries.push({
        id: Date.now(),
        name: document.getElementById("countryName").value,
        description: document.getElementById("countryDescription").value
    });

    saveData();
    alert("Country added successfully!");
    showPage("country");
}

function countryTable() {
    return `
        <div class="panel">
            <h3>Country List</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Country</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${countries.length ? countries.map(c => `
                            <tr>
                                <td>${c.id}</td>
                                <td>${escapeHTML(c.name)}</td>
                                <td>${escapeHTML(c.description)}</td>
                                <td>
                                    <button class="btn btn-danger"
                                    onclick="deleteData('countries', ${c.id})">
                                    Delete
                                    </button>
                                </td>
                            </tr>
                        `).join("") :
                        `<tr><td colspan="4" class="empty">No countries found</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}


/* CITY PAGE */

function cityPage() {
    return `
        <h2 class="page-title">City Master</h2>
        <p class="description">Add and manage cities</p>

        <div class="panel">
            <h3>Add City</h3>

            <form onsubmit="addCity(event)">
                <div class="form-grid">

                    <div class="form-group">
                        <label>City Name</label>
                        <input id="cityName" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <input id="cityDescription">
                    </div>

                </div>

                <button class="btn" type="submit">Save City</button>
            </form>
        </div>

        <div class="panel">
            <h3>City List</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>City Name</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${cities.length ? cities.map(c => `
                            <tr>
                                <td>${c.id}</td>
                                <td>${escapeHTML(c.name)}</td>
                                <td>${escapeHTML(c.description)}</td>
                                <td>
                                    <button class="btn btn-danger"
                                    onclick="deleteData('cities', ${c.id})">
                                    Delete
                                    </button>
                                </td>
                            </tr>
                        `).join("") :
                        `<tr><td colspan="4" class="empty">No cities found</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function addCity(event) {
    event.preventDefault();

    cities.push({
        id: Date.now(),
        name: document.getElementById("cityName").value,
        description: document.getElementById("cityDescription").value
    });

    saveData();
    alert("City added successfully!");
    showPage("city");
}

/* COUNTRY CITY MAPPING PAGE */

function mappingPage() {
    return `
        <h2 class="page-title">Country City Mapping</h2>
        <p class="description">Map cities with their respective countries</p>

        <div class="panel">
            <h3>Create Mapping</h3>

            <form onsubmit="addMapping(event)">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Select Country</label>
                        <select id="mapCountry" required>
                            <option value="">Select Country</option>
                            ${countries.map(c => `
                                <option value="${c.id}">
                                    ${escapeHTML(c.name)}
                                </option>
                            `).join("")}
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Select City</label>
                        <select id="mapCity" required>
                            <option value="">Select City</option>
                            ${cities.map(c => `
                                <option value="${c.id}">
                                    ${escapeHTML(c.name)}
                                </option>
                            `).join("")}
                        </select>
                    </div>

                </div>

                <button class="btn" type="submit">Save Mapping</button>

            </form>
        </div>

        <div class="panel">
            <h3>Mapping List</h3>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Country</th>
                            <th>City</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        ${mappings.length ? mappings.map(m => {
                            const country = countries.find(c => c.id === m.countryId);
                            const city = cities.find(c => c.id === m.cityId);

                            return `
                                <tr>
                                    <td>${m.id}</td>
                                    <td>${country ? escapeHTML(country.name) : "Not found"}</td>
                                    <td>${city ? escapeHTML(city.name) : "Not found"}</td>
                                    <td>
                                        <button class="btn btn-danger"
                                        onclick="deleteData('mappings', ${m.id})">
                                        Delete
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }).join("") :
                        `<tr><td colspan="4" class="empty">No mappings found</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

function addMapping(event) {
    event.preventDefault();

    const countryId = Number(document.getElementById("mapCountry").value);
    const cityId = Number(document.getElementById("mapCity").value);

    const exists = mappings.some(m =>
        m.countryId === countryId && m.cityId === cityId
    );

    if (exists) {
        alert("This mapping already exists!");
        return;
    }

    mappings.push({
        id: Date.now(),
        countryId,
        cityId
    });

    saveData();
    alert("Mapping saved successfully!");
    showPage("mapping");
}

/* COMMON FUNCTIONS */

function deleteData(type, id) {

    if (!confirm("Are you sure you want to delete this record?")) {
        return;
    }

    if (type === "users") {
        users = users.filter(item => item.id !== id);
    }

    if (type === "countries") {
        countries = countries.filter(item => item.id !== id);
        mappings = mappings.filter(item => item.countryId !== id);
    }

    if (type === "cities") {
        cities = cities.filter(item => item.id !== id);
        mappings = mappings.filter(item => item.cityId !== id);
    }

    if (type === "mappings") {
        mappings = mappings.filter(item => item.id !== id);
    }

    saveData();

    const pages = {
        users: "viewUsers",
        countries: "country",
        cities: "city",
        mappings: "mapping"
    };

    showPage(pages[type]);
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

/* OPEN DASHBOARD FIRST */

showPage("dashboard");

</script>

</body>
</html>
